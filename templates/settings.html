{% extends 'base.html' %}
{% block title %}Settings{% endblock %}
{% block page_title %}Settings{% endblock %}
{% block content %}
<form method="POST" action="/settings">
<div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;">

    <div style="display:flex;flex-direction:column;gap:20px;">
        <div class="card">
            <h2 class="card-title">🔐 Security</h2>
            <div class="form-group">
                <label>New Password</label>
                <input name="new_password" type="password" placeholder="Leave blank to keep current"/>
            </div>
        </div>
        <div class="card">
            <h2 class="card-title">🏢 Company Info</h2>
            <p style="font-size:12px;color:var(--muted);margin-bottom:12px;">Used on PDF bills</p>
            <div class="form-grid">
                <div class="form-group full">
                    <label>Company Name</label>
                    <input name="company_name" value="{{ settings.get('company_name','') }}" placeholder="e.g. Siddhi Arts"/>
                </div>
                <div class="form-group">
                    <label>Phone</label>
                    <input name="company_phone" value="{{ settings.get('company_phone','') }}" placeholder="Company phone"/>
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input name="company_email" value="{{ settings.get('company_email','') }}" placeholder="Company email"/>
                </div>
                <div class="form-group full">
                    <label>Address</label>
                    <textarea name="company_address" placeholder="Company address">{{ settings.get('company_address','') }}</textarea>
                </div>
            </div>
        </div>
    </div>

    <div style="display:flex;flex-direction:column;gap:20px;">
        <div class="card">
            <h2 class="card-title">📦 Inventory</h2>
            <div class="form-group">
                <label>Low Stock Alert Threshold</label>
                <input name="low_stock_threshold" type="number" value="{{ settings.get('low_stock_threshold',10) }}"/>
            </div>
        </div>
        <button type="submit" class="btn btn-primary" style="padding:14px;font-size:15px;justify-content:center;">
            <i class="fas fa-save"></i> Save Settings
        </button>
    </div>

</div>
<input type="hidden" name="gst_number" value=""/>
<input type="hidden" name="currency_symbol" value="Rs."/>
<input type="hidden" name="tax_percent" value="0"/>
<input type="hidden" name="default_payment" value="Cash"/>
<input type="hidden" name="bill_prefix" value="BILL"/>
<input type="hidden" name="pdf_footer" value="Thank you for your business!"/>
</form>
{% endblock %}
